    default: true
    workspace:
      host: https://dbc-5a129a87-cecb.cloud.databricks.com
    variables:
      catalog: youtube_dev
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-5a129a87-cecb.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/happyending2012to16@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/happyending2012to16@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: youtube_dev
      schema: prod
    permissions:
      - user_name: happyending2012to16@gmail.com
        level: CAN_MANAGE
