# The main pipeline for ytb_dtbrc_lrn

resources:
  pipelines:
    ytb_dtbrc_lrn_etl:
      name: ytb_dtbrc_lrn_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../src/ytb_dtbrc_lrn_etl"

      libraries:
        - glob:
            include: ../src/ytb_dtbrc_lrn_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
